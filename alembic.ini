# Alembic configuration for Gisst.
#
# The database URL is intentionally NOT set here - env.py reads it from the
# application settings (gisst.config.get_settings().database.url) so migrations
# and the running app always agree on the target database.

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names (timestamp + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Detect when migrations are run from a directory other than the project root.
prepend_sys_path = .

# Use OS path separator semantics for version locations.
version_path_separator = os

# sqlalchemy.url is supplied at runtime by env.py; left blank on purpose.
sqlalchemy.url =


[post_write_hooks]
# Run ruff over freshly generated migrations so they are repo-clean.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# -- Logging ------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
